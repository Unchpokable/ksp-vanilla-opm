// Vanilla+ OPM pack fix — Near Future Aeronautics, 2.5 m shock cone intake.
//
// nfa-intake-largeshock carries a MODULE block that names the PartModule
// "AnimatedIntake". Nothing provides that type: NearFutureAeronautics 2.x ships
// no plugin at all, none of its dependencies (B9PartSwitch, DeployableEngines,
// KerbalActuators, CommunityResourcePack) defines it, and a byte scan of every
// DLL in GameData finds no such string. KSP therefore logs
// "Cannot find a PartModule of typename 'AnimatedIntake'" and the module is
// dropped from the part.
//
// The animation itself is not missing: the model nfa-intake-largeshock.mu still
// contains the "CloseIntake" clip (transforms IntakeCircle1, IntakeCircle2,
// IntakeNose), so only the driver is gone. Upstream master still has the stale
// block — it is a leftover from Near Future Aeronautics 1.0.0, which is the
// version string in the file header.
//
// The mod's own sibling intake, nfa-intake-largecircular, moves its parts with
// the stock FXModuleAnimateThrottle. Same stock module is used here, driven by
// throttle like the sibling, so the cone animates again without any plugin.
//
// To go back to a manual toggle instead, swap the module below for
//   MODULE { name = ModuleAnimateGeneric  animationName = CloseIntake ... }

@PART[nfa-intake-largeshock]:FINAL
{
	!MODULE[AnimatedIntake] { }

	%MODULE[FXModuleAnimateThrottle]
	{
		animationName = CloseIntake
		dependOnEngineState = False
		dependOnThrottle = True
		responseSpeed = 1
		layer = 1
		animWrapMode = 1	// Once/Clamp: the cone travels between two positions, it must not loop
	}
}
