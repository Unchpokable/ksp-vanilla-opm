// Vanilla+ OPM — косметика дерева исследований (CommunityTechTree)
//
// CTT добавляет ~47 узлов-заготовок под модпаки, которых у нас нет: KSPIE даёт
// fusion/antimatter/quantum, USI-MKS и Kerbalism заполняют habitation, colonization,
// logistics, hydroponics, recycling. В нашей сборке этим узлам нечего содержать, а CTT
// отдаёт их с hideEmpty = False — поэтому KSP рисует пустые коробки.
//
// Это не потеря: каждая деталь ссылается на существующий узел, дерево целиком
// достижимо из `start`, а единственное «ведро» вне дерева — служебный узел KSP
// "Unresearcheable" (флаг и EVA-костюмы).
//
// Патч ставит hideEmpty = True тем пустым узлам, под которыми нет ни одной детали.
// KSP скрывает узел, если он пуст и hideEmpty = True, — коробки исчезают, а если
// в будущем мод положит туда детали, узел появится сам.
//
// Четыре пустых узла оставлены как есть (subsonicFlight, specializedLanders,
// specializedCommandCenters, improvedNuclearPropulsion): через них проходит путь
// к занятым узлам.
//
// Удалите этот файл, чтобы вернуть исходный вид CTT.

@RDNode:HAS[#id[advActuators]]
{
	@hideEmpty = True
}
@RDNode:HAS[#id[advColonization]]
{
	@hideEmpty = True
}
